# ============================================================
# vaults.conf — vault-maintain.sh 配置文件
# ------------------------------------------------------------
# 全局设置：KEY=VALUE（每行一个）
# vault 条目：名称|vault路径|镜像目录|KB子目录|镜像前缀(可选)
#   名称      任意标识，--vault 参数按它筛选
#   vault路径  Obsidian vault 本地路径（Git Bash 风格，如 /e/Linux）
#   镜像目录  该 vault 的镜像输出目录（如 /e/notes）
#   KB子目录  在知识库仓库中的存放位置（必须在 docs/ 下）
#   镜像前缀  可选，默认取 vault 路径末段的小写（/e/Linux → linux-）
# # 开头为注释，空行忽略
# ============================================================

KB_REPO=/e/kimi-knowledge-base
KB_REMOTE=origin
KB_BRANCH=main

Linux|/e/Linux|/e/notes|docs/02-学习笔记/Linux|

# ---- 新 vault 接入示例（复制一行改掉即可） ----
# 网络笔记|/e/NetworkNotes|/e/notes|docs/02-学习笔记/网络笔记|
# 读书笔记|/e/Reading|/e/notes|docs/02-学习笔记/读书笔记|
# 工作项目|/e/WorkDocs|/e/notes|docs/01-工作项目/WorkDocs|
